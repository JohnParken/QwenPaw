<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>QwenPaw Server Console</title><link rel="stylesheet" href="/style.css"><main><h1>QwenPaw server console</h1><p class="warning">Developer testing only. The selected user is an untrusted local identity; never use this console in production.</p><label>User <input id="user" value="test-user" maxlength="256"></label><label>Channel <input id="channel" value="test-channel"></label><label>Session <input id="session" value="test-session" placeholder="external session id"></label><label>Message <textarea id="message" placeholder="Message"></textarea></label><label>Attachment IDs (comma separated) <input id="attachments"></label><button id="send">Submit run</button> <button id="reconnect">Reconnect</button> <button id="cancel">Cancel run</button><div id="approvals"></div><pre id="output"></pre><section><h2>Sessions</h2><button id="refresh">Refresh history</button><pre id="history"></pre></section><section><h2>Session file import</h2><input id="internal-session" placeholder="internal session UUID"><input id="import-file" placeholder="file id"><button id="import">Import into session</button></section><section><h2>Files</h2><input id="file" type="file"><button id="upload">Upload</button><input id="file-id" placeholder="known file id"><button id="get-file">Get file</button><pre id="files"></pre></section></main><script type="module" src="/app.js"></script>
